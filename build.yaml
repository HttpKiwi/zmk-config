# Wired USB test first: right half as central so it types over the cable.
# Dongle / peripheral builds come back after the matrix checks out.
include:
  - board: nice_nano_v2
    shield: corne_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: corne_right_usb_test
  - board: nice_nano_v2
    shield: settings_reset
