# Dongle = BLE central (USB to host). Both halves = peripherals on battery.
include:
  - board: nice_nano_v2
    shield: corne_dongle
  - board: nice_nano_v2
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left_peripheral
  - board: nice_nano_v2
    shield: corne_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_right_peripheral
  - board: nice_nano_v2
    shield: settings_reset
