# Peripheral half: stay BLE-ready overnight (dongle USB suspend).
# Deep sleep turns the radio off; after PC sleep/wake reconnect often
# needs a hard reset. Idle still dims power without killing the link.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000

# MCU status LED battery blink on boot.
CONFIG_INDICATOR_LED_WIDGET=y
CONFIG_INDICATOR_LED_SHOW_BATTERY_ON_BOOT=y
CONFIG_INDICATOR_LED_SHOW_LAYER_CHANGE=n
CONFIG_INDICATOR_LED_SHOW_BLE=n
