# Peripheral half: deep sleep after 15 min idle (wake on keypress = reboot + BLE rejoin).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=30000

# MCU status LED battery blink on boot.
CONFIG_INDICATOR_LED_WIDGET=y
CONFIG_INDICATOR_LED_SHOW_BATTERY_ON_BOOT=y
CONFIG_INDICATOR_LED_SHOW_LAYER_CHANGE=n
CONFIG_INDICATOR_LED_SHOW_BLE=n
