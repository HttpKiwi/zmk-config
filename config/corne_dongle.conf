# Fetch peripheral SoC from left/right and expose extra BAS
# characteristics (description "auxiliary") to the BLE host.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Second HID interface for zmk-split-battery-tray / Quickshell bar.
CONFIG_USB_HID_DEVICE_COUNT=2
