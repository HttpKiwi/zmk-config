# Fetch peripheral SoC and expose BAS auxiliaries to the host.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Second HID interface for split-battery host tools.
CONFIG_USB_HID_DEVICE_COUNT=2

# Mouse keys on adjust (central HID).
CONFIG_ZMK_POINTING=y

# OLED status screen (dongle_display shield).
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
